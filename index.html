<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DeskBuddy Web</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>DeskBuddy Web</h1>

    <div class="card">
      <h2>Eye Break Timer</h2>
      <p>Interval: <span id="eye-interval-text">20</span> menit</p>
      <div class="controls">
        <button id="eye-start">Start</button>
        <button id="eye-stop">Stop</button>
      </div>
      <p id="eye-status">Status: berhenti</p>
    </div>

    <div class="card">
      <h2>Hydration Reminder</h2>
      <p>Interval: <span id="water-interval-text">60</span> menit</p>
      <div class="controls">
        <button id="water-start">Start</button>
        <button id="water-stop">Stop</button>
      </div>
      <p id="water-status">Status: berhenti</p>
    </div>

    <div class="card">
      <h2>Pomodoro</h2>
      <p id="pomo-timer">25:00</p>
      <div class="controls">
        <button id="pomo-start">Start</button>
        <button id="pomo-pause">Pause</button>
        <button id="pomo-reset">Reset</button>
      </div>
    </div>

    <div class="card">
      <h2>To-Do List</h2>
      <ul id="todo-list"></ul>
      <input id="todo-input" placeholder="Tambah tugas..." />
      <div class="controls">
        <button id="todo-add">Tambah</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
